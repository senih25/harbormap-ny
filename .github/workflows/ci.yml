name: HarborMap quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harbormap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: validate-public-data-and-site
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository (GitHub-owned, pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node.js 24 (GitHub-owned, pinned)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Run deterministic source and site checks
        run: npm test
